name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * 1" # weekly (Mon 05:23 UTC) to catch dependency drift

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  NEUROQUERY_ENGINE: demo

jobs:
  quality:
    name: quality / py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov pip-audit

      - name: Validate environment
        run: |
          python -m compileall -q app tests
          pip check

      - name: Run tests (with coverage)
        run: |
          python -m pytest -q --maxfail=1 --disable-warnings \
            --junitxml=test-results/junit-${{ matrix.python-version }}.xml \
            --cov=app --cov-report=term-missing --cov-report=xml:coverage-${{ matrix.python-version }}.xml

      - name: Run evaluation harness (offline/demo)
        run: python -m app.evaluate

      - name: Dependency audit (advisory)
        continue-on-error: true
        run: python -m pip_audit -r requirements.txt --progress-spinner off

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts-py${{ matrix.python-version }}
          path: |
            test-results/junit-${{ matrix.python-version }}.xml
            coverage-${{ matrix.python-version }}.xml
            eval/report.json
          if-no-files-found: warn
          retention-days: 14

  docker:
    name: docker / build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: neuroquery:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test container
        run: |
          docker run -d --rm --name neuroquery-ci -p 18000:8000 -e NEUROQUERY_ENGINE=demo neuroquery:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18000/api/health >/tmp/health.json; then break; fi
            sleep 1
          done
          cat /tmp/health.json
          python -c "import json; d=json.load(open('/tmp/health.json')); assert d.get('status')=='ok'; print('health ok')"
          docker logs neuroquery-ci || true
          docker stop neuroquery-ci

  all-checks:
    name: all checks
    runs-on: ubuntu-latest
    if: always()
    needs: [quality, docker]
    steps:
      - name: Verify required jobs passed
        run: |
          echo "quality=${{ needs.quality.result }} docker=${{ needs.docker.result }}"
          test "${{ needs.quality.result }}" = "success"
          test "${{ needs.docker.result }}" = "success"
