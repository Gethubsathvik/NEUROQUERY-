[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [".kilo", ".venv", ".venv-1", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "S101"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_configs = true
no_implicit_optional = true
exclude = '(\\.kilo|\\.venv|data)'
